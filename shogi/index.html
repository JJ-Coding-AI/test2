<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ブラウザ将棋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ブラウザ将棋</h1>
  <div id="status">先手の番です</div>
  <div id="board" class="board"></div>
  <div class="hands">
    <div id="black-hand" class="hand">
      <h2>先手の持ち駒</h2>
    </div>
    <div id="white-hand" class="hand">
      <h2>後手の持ち駒</h2>
    </div>
  </div>
  <button id="undoButton">待った</button>
  <script src="main.js"></script>
</body>
</html>
