<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Shogi App</title>
  <script src="https://unpkg.com/shogi.js@latest/dist/index.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Shogi App</h1>
  <div id="turn">Turn: <span id="turnText"></span></div>
  <div id="board"></div>
  <div class="hands">
    <div id="hand-black" class="hand"></div>
    <div id="hand-white" class="hand"></div>
  </div>
  <button id="undo">Undo</button>
  <script src="script.js"></script>
</body>
</html>
