<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ドラッグ＆ドロップ将棋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>ドラッグ＆ドロップ将棋</h1>
<div id="turnDisplay">先手の番</div>
<div id="board" class="board"></div>
<div class="captured-area">
  <h3>先手の持ち駒</h3>
  <div id="captured-black" class="captured"></div>
</div>
<div class="captured-area">
  <h3>後手の持ち駒</h3>
  <div id="captured-white" class="captured"></div>
</div>
<button id="undoButton">待った</button>
<script src="script.js"></script>
</body>
</html>
