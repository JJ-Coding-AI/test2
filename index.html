<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ブラウザ将棋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="controls">
    <span id="turn">手番: 先手</span>
    <select id="level">
      <option value="300">やさしい</option>
      <option value="1000" selected>ふつう</option>
      <option value="3000">つよい</option>
    </select>
    <button id="undo">待った</button>
  </div>
  <div id="board"></div>
  <div id="hands">
    <div id="hand-player" class="hand">持ち駒(先手)</div>
    <div id="hand-ai" class="hand ai">持ち駒(後手)</div>
  </div>
<script src="shogi.js"></script>
</body>
</html>
