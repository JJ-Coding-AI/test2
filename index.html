<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Web Shogi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Web Shogi</h1>
  <div id="turn"></div>
  <div id="board" class="board"></div>

  <script src="shogi.js"></script>
</body>
</html>
